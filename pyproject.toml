[project]
name = "nekita"
version = "2.0.0.dev0"
description = "Nekita: bot de Telegram (aiogram + SQLite), ligero y modular"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.13"
dependencies = [
    "aiogram>=3.31,<4",
    "pydantic-settings>=2.16,<3",
    "httpx>=0.28,<1",
    "aiosqlite>=0.21",
    "tzdata",
]

[project.scripts]
nekita = "nekita.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1",
    "pytest-cov>=6",
    "ruff>=0.12",
    "mypy>=1.16",
    "pip-audit>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nekita"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF", "TID", "S"]
# ASYNC240: mkdir/is_file puntuales de arranque; no merece un hilo
ignore = ["ASYNC240"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "ASYNC109", "ASYNC110", "ASYNC240"]

[tool.mypy]
strict = true
python_version = "3.13"
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: pruebas contra servicios externos reales (fuera de la CI normal)"]
addopts = "-m 'not live' --strict-markers"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/nekita"]
branch = true
